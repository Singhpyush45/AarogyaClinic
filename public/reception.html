<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reception | Aarogya Homeopathic Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/clinic.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">आ</div>
      <span class="sidebar-title">Reception</span>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Patient Intake
      </button>
      <button class="sidebar-link" id="navProfile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        My Profile
      </button>
    </nav>
    <div class="sidebar-tagline-card">
      <div class="tagline-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg></div>
      <h4>Great care starts at the front desk.</h4>
      <p>Every patient. Every time.</p>
    </div>
  </aside>

  <div class="app-content">
    <header class="clinic-header">
      <button class="mobile-sidebar-toggle" id="mobileSidebarToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="brand">
        <div>
          <div style="font-family:'Fraunces',serif;font-size:21px;color:var(--sage-deep);font-weight:700;line-height:1.2;">Patient Intake</div>
          <div id="welcomeMsg" style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">Welcome back</div>
        </div>
      </div>
      <div class="header-right">
        <span class="role-tag">Reception</span>
        <span id="staffNameDisplay" style="font-size:13px;color:var(--ink-soft);"></span>
        <button class="profile-avatar-btn" id="profileBtn">👤</button>
        <button class="btn-outline btn-sm" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <main class="clinic-main">
      <div class="page-title"><h1>Patient Intake</h1></div>

      <!-- Search existing patient -->
      <div class="form-card">
        <h3>Find Existing Patient</h3>
        <div class="form-grid">
          <div class="field">
            <label>Search by phone number</label>
            <div class="icon-field">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
              <input type="tel" id="searchPhone" placeholder="10-digit phone number">
            </div>
          </div>
          <div class="field" style="align-self:end;"><button class="btn" id="searchBtn" type="button">Search</button></div>
        </div>
        <div id="searchResults"></div>
      </div>

      <!-- Intake form -->
      <div class="form-card">
        <h3 id="intakeFormTitle">New Patient Registration</h3>
        <form id="intakeForm">
          <input type="hidden" name="patient_id" id="patientIdField">
          <div class="form-grid">
            <div class="field">
              <label>First Name *</label>
              <div class="icon-field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" name="first_name" required>
              </div>
            </div>
            <div class="field">
              <label>Last Name</label>
              <div class="icon-field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" name="last_name">
              </div>
            </div>
          </div>
          <div class="form-grid">
            <div class="field">
              <label>Phone Number *</label>
              <div class="icon-field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                <input type="tel" name="phone" required>
              </div>
            </div>
            <div class="field">
              <label>Gender</label>
              <div class="icon-field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M12 13v8M9 18h6"/></svg>
                <select name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
              </div>
            </div>
          </div>
          <div class="form-grid cols-3">
            <div class="field">
              <label>Age</label>
              <div class="icon-field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <input type="number" name="age" min="0" max="120">
              </div>
            </div>
            <div class="field">
              <label>Date of Birth</label>
              <div class="icon-field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <input type="date" name="dob">
              </div>
            </div>
            <div class="field">
              <label>Weight (kg)</label>
              <div class="icon-field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M9 9l1.5 1.5M15 9l-1.5 1.5M12 13v3"/></svg>
                <input type="text" name="weight">
              </div>
            </div>
          </div>
          <div class="field">
            <label>Address</label>
            <div class="icon-field">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="top:16px;transform:none;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <textarea name="address" rows="2" style="padding-left:36px;"></textarea>
            </div>
          </div>

          <h3 style="margin-top:18px;">Vitals</h3>
          <div class="form-grid cols-3">
            <div class="field"><label>Blood Pressure</label><input type="text" name="bp" placeholder="e.g. 120/80"></div>
            <div class="field"><label>Temperature</label><input type="text" name="temperature" placeholder="e.g. 98.6°F"></div>
            <div class="field"><label>Pulse</label><input type="text" name="pulse" placeholder="e.g. 76 bpm"></div>
          </div>
          <div class="field"><label>Chief Complaint / Symptoms</label><textarea name="chief_complaint" rows="2" placeholder="What is the patient here for?"></textarea></div>
          <div class="field"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>

          <button type="submit" class="btn" id="intakeSubmitBtn">Add to Doctor's Queue</button>
          <p class="login-msg" id="intakeMsg"></p>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/clinic-common.js"></script>
<script src="js/reception.js"></script>
<script>
  document.getElementById('navProfile').addEventListener('click', () => document.getElementById('profileBtn').click());
  document.getElementById('mobileSidebarToggle').addEventListener('click', () => {
    document.getElementById('appSidebar').classList.toggle('mobile-open');
  });
</script>
</body>
</html>
